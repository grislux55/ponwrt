name: NNRRWrt CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (required when create_release is enabled)
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        default: true
        type: boolean
      create_release:
        description: Create GitHub Release after build succeeds
        required: false
        default: false
        type: boolean
      targets:
        description: Build target matrix
        required: false
        default: nnrrwrt-xg040g-md
        type: choice
        options:
          - nnrrwrt-xg040g-md
          - an7581
          - all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

jobs:
  sanitize:
    name: Sanitization & Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            gitleaks git . --config .gitleaks.toml --no-banner --redact --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            gitleaks git . --config .gitleaks.toml --no-banner --redact --log-opts="-n 50"
          fi
          for dir in configs target/linux/airoha scripts package/base-files/files-nnrrwrt .github; do
            gitleaks dir "$dir" --config .gitleaks.toml --no-banner --redact
          done

      - name: Run repository sanitization rules
        run: ./.github/scripts/check-sanitization.sh

  static-checks:
    name: Static Checks
    needs: sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Install static check & kconfig dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bzip2 file gawk git libncurses-dev perl python3 \
            shellcheck unzip xz-utils
          ACTIONLINT_VERSION="1.7.12"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Run repository static checks
        run: ./.github/scripts/check-static.sh

      - name: Update and install feeds for defconfig check
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify merged Kconfig and defconfig
        run: ./.github/scripts/check-static.sh --with-defconfig

      - name: Compute build target matrix
        id: matrix
        env:
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          if [[ "$GITHUB_REF_NAME_FULL" == refs/tags/v* ]] || [ "$INPUT_TARGETS" = "all" ]; then
            echo 'targets=["nnrrwrt-xg040g-md","an7581","an7583"]' >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_TARGETS" = "an7581" ]; then
            echo 'targets=["an7581"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["nnrrwrt-xg040g-md"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [sanitize, static-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.static-checks.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo -v
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          wait
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: |
          if [ "$TARGET_NAME" = "nnrrwrt-xg040g-md" ]; then
            cp configs/nnrrwrt-xg040g-md.config .config
          else
            ./scripts/kconfig.pl + \
              "configs/${TARGET_NAME}.config" \
              configs/release.config > .config
          fi
          ./scripts/kconfig.pl + .config \
            <(printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\nCONFIG_AUTOREMOVE=y\n') > .config.ci
          mv .config.ci .config
          make defconfig
          if [ "$TARGET_NAME" = "an7581" ] || [ "$TARGET_NAME" = "nnrrwrt-xg040g-md" ]; then
            grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y$' .config
            grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y$' .config
          fi
          grep -E '^CONFIG_(TARGET_airoha|TARGET_MULTI_PROFILE|DEVEL|CCACHE|AUTOREMOVE|USE_APK|SIGNED_PACKAGES|SIGN_EACH_PACKAGE|USE_LLVM|BPF_TOOLCHAIN|TOOLCHAIN|GCC|BINUTILS|GDB|MUSL|GLIBC|USE_MUSL|USE_GLIBC|USE_RUST|RUST_|PKG_CC_STACKPROTECTOR|SSP_SUPPORT|FORTIFY|RELRO|ASLR|PIE)' .config \
            | LC_ALL=C sort > tmp/toolchain-cache-key.txt
          {
            cat tmp/toolchain-cache-key.txt
            grep -E '^CONFIG_(TARGET_PER_DEVICE_ROOTFS|PACKAGE_kmod-airoha|PACKAGE_airoha-tr069-fake|PACKAGE_tailscale|PACKAGE_python3)' .config | LC_ALL=C sort || true
            git -C feeds/packages rev-parse HEAD:lang/rust HEAD:lang/golang HEAD:lang/python HEAD:devel/rust-bindgen 2>/dev/null || true
            git -C feeds/luci rev-parse HEAD:modules/luci-base HEAD:contrib/package/csstidy 2>/dev/null || true
          } > tmp/hostpkg-cache-key.txt

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Cache tools and toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
          key: ponwrt-toolchain-v1-${{ matrix.target }}-${{ hashFiles('tools/**', 'toolchain/**', 'package/system/apk/**', 'package/system/fwtool/**', 'package/system/ucert/**', 'package/system/usign/**', 'package/libs/libubox/**', 'package/libs/libjson-c/**', 'include/host-build.mk', 'include/toolchain-build.mk', 'include/subdir.mk', 'include/kernel-version.mk', 'include/prereq-build.mk', 'rules.mk', 'Makefile', 'tmp/toolchain-cache-key.txt') }}

      - name: Cache host packages and language toolchains
        id: cache-hostpkg
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/hostpkg
            staging_dir/target-*/host
            build_dir/hostpkg
            build_dir/target-*/host
          key: ponwrt-hostpkg-v1-${{ matrix.target }}-${{ hashFiles('tools/**', 'toolchain/**', 'package/system/apk/**', 'package/utils/ucode/**', 'package/libs/libubox/**', 'package/libs/ncurses/**', 'package/libs/libffi/**', 'package/libs/libjson-c/**', 'package/utils/lua/**', 'package/utils/bzip2/**', 'package/system/fwtool/**', 'package/system/usign/**', 'package/system/ucert/**', 'package/boot/arm-trusted-firmware-tools/**', 'package/boot/arm-trusted-firmware-airoha/**', 'include/host-build.mk', 'include/toolchain-build.mk', 'include/subdir.mk', 'include/kernel-version.mk', 'include/prereq-build.mk', 'include/rust-values.mk', 'rules.mk', 'Makefile', 'tmp/hostpkg-cache-key.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ponwrt-ccache-v1-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-v1-${{ matrix.target }}-

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Refresh restored build cache stamps
        if: steps.cache-toolchain.outputs.cache-hit == 'true' || steps.cache-hostpkg.outputs.cache-hit == 'true'
        env:
          CACHE_TOOLCHAIN_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
          CACHE_HOSTPKG_HIT: ${{ steps.cache-hostpkg.outputs.cache-hit }}
        run: |
          stamp_ref="$(mktemp)"
          trap 'rm -f "$stamp_ref"' EXIT
          if [ "$CACHE_HOSTPKG_HIT" = "true" ] && [ "$CACHE_TOOLCHAIN_HIT" != "true" ]; then
            rm -rf \
              build_dir/hostpkg/apk-* \
              build_dir/hostpkg/fwtool-* \
              build_dir/hostpkg/ucert-* \
              build_dir/hostpkg/usign-* \
              build_dir/hostpkg/libubox-* \
              build_dir/hostpkg/json-c-* \
              staging_dir/hostpkg/stamp/.fwtool_installed \
              staging_dir/hostpkg/stamp/.ucert_installed \
              staging_dir/hostpkg/stamp/.usign_installed
          fi
          touch "$stamp_ref"
          if [ "$CACHE_TOOLCHAIN_HIT" = "true" ]; then
            [ -f staging_dir/host/.prereq-build ] && touch -r "$stamp_ref" staging_dir/host/.prereq-build
            [ -f staging_dir/host/.prepared ] && touch -r "$stamp_ref" staging_dir/host/.prepared
          fi
          if [ "$CACHE_HOSTPKG_HIT" = "true" ]; then
            host_build_dirs=()
            for dir in build_dir/hostpkg build_dir/hostpkg/pypi build_dir/target-*/host; do
              [ -d "$dir" ] && host_build_dirs+=("$dir")
            done
            if [ "${#host_build_dirs[@]}" -gt 0 ]; then
              find "${host_build_dirs[@]}" -maxdepth 2 -type f -name '.prepared*' -exec touch -r "$stamp_ref" {} +
              sleep 1
              touch "$stamp_ref"
              find "${host_build_dirs[@]}" -maxdepth 2 -type f -name '.configured*' -exec touch -r "$stamp_ref" {} +
              sleep 1
              touch "$stamp_ref"
              find "${host_build_dirs[@]}" -maxdepth 2 -type f -name '.built*' -exec touch -r "$stamp_ref" {} +
            fi
            sleep 1
            touch "$stamp_ref"
            if [ -d staging_dir/hostpkg/stamp ]; then
              find staging_dir/hostpkg/stamp -maxdepth 1 -type f -name '.*_installed' -exec touch -r "$stamp_ref" {} +
            fi
          fi
          if [ "$CACHE_TOOLCHAIN_HIT" = "true" ]; then
            sleep 1
            touch "$stamp_ref"
            if [ -d staging_dir/host/stamp ]; then
              find staging_dir/host/stamp -maxdepth 1 -type f -name '.*_installed' -exec touch -r "$stamp_ref" {} +
            fi
            sleep 1
            touch "$stamp_ref"
            if [ -d staging_dir/host/stamp ]; then
              find staging_dir/host/stamp -maxdepth 1 -type f -name '.tools_compile*' -exec touch -r "$stamp_ref" {} +
            fi
            for info_mk in staging_dir/toolchain-*/info.mk; do
              [ -f "$info_mk" ] && touch -r "$stamp_ref" "$info_mk"
            done
            for stamp_dir in staging_dir/toolchain-*/stamp; do
              [ -d "$stamp_dir" ] && find "$stamp_dir" -maxdepth 1 -type f -name '.*_installed' -exec touch -r "$stamp_ref" {} +
            done
            sleep 1
            touch "$stamp_ref"
            for stamp_dir in staging_dir/toolchain-*/stamp; do
              [ -d "$stamp_dir" ] && find "$stamp_dir" -maxdepth 1 -type f -name '.toolchain_compile*' -exec touch -r "$stamp_ref" {} +
            done
          fi

      - name: Build ${{ matrix.target }}
        env:
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: "1.5G"
          CCACHE_COMPILERCHECK: "content"
          CCACHE_SLOPPINESS: "time_macros,locale"
        run: |
          make -j"$(nproc)"
          if [ -x staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s
          fi

      - name: Remove temporary private signing key
        if: always()
        run: rm -f private-key.pem

      - name: Verify XG-040G-MD baseline images
        if: matrix.target == 'an7581' || matrix.target == 'nnrrwrt-xg040g-md'
        run: |
          ls -lh bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi*itb
          test -s bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi-initramfs-recovery.itb
          test -s bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi-squashfs-sysupgrade.itb
          test -s bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi-usb-sfp-initramfs-recovery.itb
          test -s bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi-usb-sfp-squashfs-sysupgrade.itb

      - name: Pack ${{ matrix.target }}
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: |
          mkdir -p release
          subtarget_dir="$TARGET_NAME"
          archive_name="ponwrt-${TARGET_NAME}.tar.zst"
          if [ "$TARGET_NAME" = "nnrrwrt-xg040g-md" ]; then
            subtarget_dir="an7581"
            archive_name="nnrrwrt-xg040g-md.tar.zst"
          fi
          tar --zstd -cf "release/${archive_name}" \
            -C bin/targets/airoha "${subtarget_dir}"
          if [ "$TARGET_NAME" = "an7581" ] || [ "$TARGET_NAME" = "nnrrwrt-xg040g-md" ]; then
            cp bin/targets/airoha/an7581/*nokia_xg-040g-md-ubi*itb release/
          fi
          ./.github/scripts/check-sanitization.sh --check-artifacts release

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: [sanitize, static-checks, build]
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release
          merge-multiple: true

      - name: Verify release artifacts are sanitized
        run: ./.github/scripts/check-sanitization.sh --check-artifacts release

      - name: Create checksums
        working-directory: release
        run: rm -f sha256sums && sha256sum -- * > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          prerelease=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$PRERELEASE_INPUT" = "true" ] && prerelease=true
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "NNRRWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$prerelease" = true ]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${args[@]}"
          fi
